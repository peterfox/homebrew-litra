name: Update Formula

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release info
        id: release
        run: |
          RESPONSE=$(curl -sf "https://api.github.com/repos/peterfox/litra/releases/latest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          VERSION="${TAG#v}"
          URL=$(echo "$RESPONSE" | jq -r '
            .assets[]
            | select(.name | test("(macos|darwin).*\\.tar\\.gz$"; "i"))
            | .browser_download_url
          ' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::No macOS .tar.gz asset found in release $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          CURRENT=$(grep -oP '(?<=/v)[\d.]+(?=/)' Formula/litra.rb | head -1)
          echo "current=$CURRENT"
          echo "latest=${{ steps.release.outputs.version }}"
          if [ "$CURRENT" = "${{ steps.release.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release and compute SHA256
        if: steps.check.outputs.needed == 'true'
        id: sha
        run: |
          curl -sfL "${{ steps.release.outputs.url }}" -o release.tar.gz
          SHA=$(sha256sum release.tar.gz | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        if: steps.check.outputs.needed == 'true'
        run: |
          URL="${{ steps.release.outputs.url }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/litra.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/litra.rb

      - name: Commit and push
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/litra.rb
          git commit -m "Update litra to v${{ steps.release.outputs.version }}"
          git push
